name: collect-news

on:
  schedule:
    - cron: "37 * * * *"       # hourly at :37 UTC (02:37 UTC = 08:07 IST digest run); public repo = unlimited minutes
  workflow_dispatch:
    inputs:
      limit:
        description: "Articles to enrich with the LLM this run"
        default: "30"

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -q -r requirements.txt
      - name: Run pipeline
        env:
          APP_ENV: production
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB: techinews
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_READ_TOKEN }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: python scripts/run_pipeline.py --limit "${{ github.event.inputs.limit || '30' }}"
      - name: Send pushes
        if: always()
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB: techinews
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: python scripts/send_pushes.py
