# Best-effort wake-up ping for the Render free-tier API.
#
# This does NOT keep the API warm. GitHub runs scheduled workflows on a
# best-effort basis: measured 2026-09-09..19, the median gap between runs was
# 201 minutes (every gap exceeded Render's 15-minute sleep window). The app
# handles cold starts itself (long timeouts + one retry in api_client.dart).
# Staying warm for real needs an external pinger (UptimeRobot / cron-job.org
# at 5 min) or a paid Render instance.
#
# The ping tolerates a cold wake (retries, 90 s budget) so a sleeping service
# no longer reports as a failed run.
name: keep-api-warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: curl -fsS --retry 4 --retry-delay 10 --retry-all-errors --max-time 90 https://techinews-api.onrender.com/health
