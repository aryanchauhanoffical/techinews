name: techinews
description: "AI-Powered Tech Intelligence Platform — personalized AI/tech news, GitHub discovery, smart notifications."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.7

  # Networking
  dio: ^5.7.0
  retry: ^3.1.2

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Models / JSON
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Env
  flutter_dotenv: ^5.1.0

  # UI helpers
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  flutter_inappwebview: ^6.1.5

  # Misc
  collection: ^1.18.0
  equatable: ^2.0.5
  logger: ^2.4.0
  uuid: ^4.5.1

  # Firebase (Android configured via android/app/google-services.json)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.1
  # Enable later when configured:
  # firebase_analytics: ^11.3.3
  # firebase_crashlytics: ^4.1.3
  # sign_in_with_apple: ^6.1.2

  # Analytics (commented until PostHog key provided)
  # posthog_flutter: ^4.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Codegen
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.3
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/mock/
    - .env
